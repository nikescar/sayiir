[package]
name = "sayiir-openflow"
description = "OpenFlow JSON and Mermaid markdown import/export for Sayiir workflow engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
categories.workspace = true
keywords.workspace = true
documentation = "https://docs.rs/sayiir-openflow"

[lib]
name = "sayiir_openflow"
path = "src/lib.rs"

[[bin]]
name = "cargo-sayiir-openflow"
path = "src/bin/cargo-sayiir-openflow.rs"

[dependencies]
sayiir-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
which = "6.0"
dirs = "5.0"
tokio = { workspace = true, features = ["process", "time"] }
clap = { version = "4", features = ["derive"] }
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
toml = "0.8"
regex = "1.10"
walkdir = "2.4"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
filetime = "0.2"
tempfile = "3.8"
md5 = "0.7"
